# .github/workflows/android-ci.yml
name: Run Test and Build APK

# ----------------------------------------------------------------------
# 1. Trigger
# Defines when the workflow should run
# ----------------------------------------------------------------------
on:
  push:
    # Target only the main/develop/staging branches when code is pushed directly
    branches:
      - main
      - develop
      - staging # Added staging to run on direct pushes
  pull_request:
    # Target specific long-lived branches (main, develop, staging)
    # AND any branch matching the glob pattern (e.g., feature/login, bugfix/crash)
    branches:
      - main
      - develop
      - staging # Added staging to run on Pull Requests targeting this branch
      - 'feature/*'
      - 'bugfix/*'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# ----------------------------------------------------------------------
# 2. Jobs
# The main processes that will be executed
# ----------------------------------------------------------------------
jobs:
  build:
    name: Build, Lint, and Test
    # The type of machine to run the job on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - uses: actions/checkout@v2

      # Step 2: Set up Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

          # Step 3: Grant execute permissions for gradlew
      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      # Step 4: Run Android Lint Checks
      # This runs the lint tool against the debug build variant.
      - name: Run Android Lint Checks
        run: ./gradlew lintDebug
            # ----------------------------------------------------------------
            # NEW STEP 4: Inject Version Code
            # ----------------------------------------------------------------
                 - name: Inject Version Code (Set versionCode from CI run number)
            # Use the CI run number (a monotonically increasing integer) for versionCode
                 run: |
                   # The Android versionName should be manually updated in build.gradle
                   # The CI run number will be the versionCode
                   echo "CI Run Number: ${{ github.run_number }}"
                   
                   # The sed command finds the 'versionCode' line and replaces its value
                   # with the current GitHub Run Number. This requires your versionCode
                   # to be set as a simple integer in your app/build.gradle.
                   sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
                   
                   # Optional: Log the updated file content to verify the change
                   echo "--- app/build.gradle content after version bump ---"
                   cat app/build.gradle | grep 'versionCode'
                   echo "------------------------------------------------------"
            # ----------------------------------------------------------------

      # ----------------------------------------------------------------
      # NEW STEPS FOR BUILDING AND ARTIFACT UPLOAD
      # ----------------------------------------------------------------
      
      # Step 6: Assemble the Debug APK
      # Use 'assembleRelease' for a signed release APK (requires configuration)
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # Step 7: Upload the APK as a workflow artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4 # ✅ Use the latest version
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk