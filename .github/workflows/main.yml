# .github/workflows/android-ci.yml
name: Run Test and Build APK

# ----------------------------------------------------------------------
# 1. Trigger
# Defines when the workflow should run
# ----------------------------------------------------------------------
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# ----------------------------------------------------------------------
# 2. Jobs
# The main processes that will be executed
# ----------------------------------------------------------------------
jobs:
  build:
    name: Build, Lint, and Test
    # The type of machine to run the job on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - uses: actions/checkout@v2

      # Step 2: Set up Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Cache Gradle files to speed up subsequent runs
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project

      # Step 4: Grant execute permissions for gradlew
      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      # Step 5: Run unit tests (with exclusion)
      - name: Run unit tests (Skipped)
        # The 'assembleDebug' command is sufficient to build the APK.
        # However, if you had a command like 'check assembleDebug'
        # which depends on tests, you'd use the exclude option.
        run: ./gradlew clean assembleDebug --exclude-task testDebug

      # ----------------------------------------------------------------
      # NEW STEPS FOR BUILDING AND ARTIFACT UPLOAD
      # ----------------------------------------------------------------
      
      # Step 6: Assemble the Debug APK
      # Use 'assembleRelease' for a signed release APK (requires configuration)
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # Step 7: Upload the APK as a workflow artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4 # ✅ Use the latest version
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk